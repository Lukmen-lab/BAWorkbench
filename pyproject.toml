[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ba-conjugate-candidate-generator"
version = "0.1.0"
description = "RDKit-based bile-acid conjugate candidate generator for docking and LC-MS/MS follow-up."
requires-python = ">=3.10"
dependencies = [
  "rdkit>=2023.9",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "streamlit>=1.35",
  "py3Dmol>=2.0",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ba_conjugate_generator*"]
